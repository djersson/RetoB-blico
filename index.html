<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Reto Bíblico</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1f2937;--accent:#6d4aff;--good:#198754;--bad:#dc3545}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:650px;margin:auto;padding:18px 16px 90px}
h1{font-size:30px;margin:8px 0 2px}
.sub{opacity:.7;margin:0 0 18px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 28px rgba(0,0,0,.07);margin:14px 0}
button{width:100%;border:0;border-radius:14px;padding:15px 16px;margin:7px 0;font-size:17px;font-weight:600;background:#ece9ff;color:#2f225f}
button.primary{background:var(--accent);color:white}
button.good{background:#dff4e8;color:#0b6b3a}
button.bad{background:#fde5e7;color:#97202c}
.small{font-size:14px;opacity:.72}
.hidden{display:none}
.progress{height:9px;background:#e7e7ef;border-radius:10px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:var(--accent);width:0}
#feedback{font-weight:700;margin-top:10px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.answer{padding:14px;background:#f6f3ff;border-radius:14px;margin-top:12px}
footer{text-align:center;opacity:.55;font-size:12px;margin-top:24px}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.titleText{flex:1;min-width:0}
.schoolLogo{width:58px;height:58px;object-fit:contain;border-radius:12px;background:white;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.credit{margin:6px 0 0;font-size:13px;opacity:.78;line-height:1.35}
.celebration{text-align:center;padding:10px 0 4px;animation:pop .6s ease}
.trophy{font-size:78px;line-height:1}
.stars{font-size:32px;letter-spacing:8px;animation:twinkle 1s infinite alternate}
@media (max-width:520px){.titleRow{align-items:flex-start}.schoolLogo{width:50px;height:50px}.credit{font-size:12px}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes twinkle{0%{transform:scale(1);opacity:.65}100%{transform:scale(1.12);opacity:1}}
</style>
</head>

  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+delay+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+delay); o.stop(c.currentTime+delay+dur+0.02);
}
function successSound(){
  tone(523.25,.12,'sine',.12,0);
  tone(659.25,.14,'sine',.12,.10);
  tone(783.99,.18,'sine',.13,.20);
}
function failSound(){
  tone(220,.18,'sawtooth',.08,0);
  tone(174.61,.24,'sawtooth',.07,.15);
}
function championFanfare(){
  // Original victory fanfare, not based on any copyrighted song.
  const notes=[
    [523.25,.18,0],[659.25,.18,.16],[783.99,.22,.32],
    [1046.5,.34,.50],[783.99,.18,.82],[987.77,.18,.98],
    [1174.66,.22,1.14],[1318.51,.42,1.34]
  ];
  notes.forEach(([f,d,t])=>tone(f,d,'triangle',.12,t));
  [0, .34, .68, 1.02, 1.36].forEach(t=>tone(130.81,.08,'square',.035,t));
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function show(id){['home','quiz','learn','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function startQuiz(n, source=QUESTIONS){
  session=shuffle(source).slice(0,Math.min(n,source.length)); idx=0; correct=0; show('quiz'); renderQuiz();
}
function renderQuiz(){
  answered=false;
  let item=session[idx];
  document.getElementById('counter').textContent=`Pregunta ${idx+1}/${session.length}`;
  document.getElementById('score').textContent=`Aciertos: ${correct}`;
  document.getElementById('bar').style.width=`${(idx/session.length)*100}%`;
  document.getElementById('question').textContent=item.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').classList.add('hidden');
  let box=document.getElementById('options'); box.innerHTML='';
  item.opts.forEach(opt=>{
    let b=document.createElement('button'); b.textContent=opt;
    b.onclick=()=>choose(b,opt,item); box.appendChild(b);
  });
}
function choose(btn,opt,item){
  if(answered)return; answered=true;
  [...document.getElementById('options').children].forEach(b=>b.disabled=true);
  if(opt===item.a){
    correct++; btn.classList.add('good');
    successSound();
    document.getElementById('feedback').textContent='✅ ¡Correcto!';
    errors=errors.filter(q=>q!==item.q);
  }else{
    btn.classList.add('bad');
    failSound();
    [...document.getElementById('options').children].forEach(b=>{if(b.textContent===item.a)b.classList.add('good')});
    document.getElementById('feedback').textContent='❌ Respuesta correcta: '+item.a;
    if(!errors.includes(item.q)) errors.push(item.q);
  }
  localStorage.setItem('bible_errors',JSON.stringify(errors));
  document.getElementById('score').textContent=`Aciertos: ${correct}`;
  document.getElementById('nextBtn').classList.remove('hidden');
}
function nextQuestion(){
  idx++;
  if(idx>=session.length) finishQuiz(); else renderQuiz();
}
function finishQuiz(){
  show('result');
  let pct=Math.round(correct/session.length*100);
  const cel=document.getElementById('celebration');
  cel.classList.add('hidden');
  if(pct===100){
    cel.classList.remove('hidden');
    document.getElementById('resultTitle').textContent='🏆 ¡CAMPEONA! ¡100% DE ACIERTOS!';
    document.getElementById('resultText').textContent=`¡Perfecto! ${correct} de ${session.length}. ¡Dominaste este reto bíblico!`;
    championFanfare();
  }else{
    document.getElementById('resultTitle').textContent=pct>=90?'🌟 ¡Excelente!':pct>=70?'👏 ¡Muy bien!':'📚 Sigamos practicando';
    document.getElementById('resultText').textContent=`Resultado: ${correct} de ${session.length} (${pct}%). Errores guardados para repasar.`;
  }
}
let learnSession=[], lidx=0;
function startLearn(){learnSession=shuffle(QUESTIONS);lidx=0;show('learn');renderLearn()}
function renderLearn(){
  let item=learnSession[lidx];
  document.getElementById('learnCount').textContent=`${lidx+1}/${learnSession.length}`;
  document.getElementById('learnQ').textContent=item.q;
  document.getElementById('learnA').textContent=item.a;
  document.getElementById('learnA').classList.add('hidden');
}
function showAnswer(){document.getElementById('learnA').classList.remove('hidden')}
function nextLearn(){lidx=(lidx+1)%learnSession.length;renderLearn()}
function startErrors(){
  let src=QUESTIONS.filter(x=>errors.includes(x.q));
  if(!src.length){
    show('result');document.getElementById('resultTitle').textContent='🎉 Sin errores pendientes';
    document.getElementById('resultText').textContent='Todavía no hay preguntas falladas guardadas. Haz un quiz primero.';
  }else startQuiz(src.length,src);
}
function goHome(){
  const cel=document.getElementById('celebration');
  if(cel) cel.classList.add('hidden');
  show('home');
}
</script>
